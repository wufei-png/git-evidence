[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-evidence"
dynamic = ["version"]
description = "Git Evidence: evidence-first engineering activity reports across GitHub, GitLab, and Gitee"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "PyYAML>=6.0",
    "idna>=3.7,<4",
    "jsonschema>=4.18",
    "rfc8785>=0.1.4,<0.2",
    "tzdata>=2025.2",
]

[project.scripts]
git-evidence = "git_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "git_evidence.__version__"}

[tool.setuptools.package-data]
git_evidence = ["py.typed", "schemas/*.json"]
