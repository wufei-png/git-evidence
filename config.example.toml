[window]
start = 2026-07-27T00:00:00Z
end = 2026-08-03T00:00:00Z
timezone = "UTC"

[scope]
actors = []

[[scope.repositories]]
provider_ref = "public-github"
owner = "example"
name = "project"

[providers.public-github]
kind = "github"
instance = "github.com"
token_env = "GITHUB_TOKEN"
include_activity_api = false

[providers.public-github.transport]
verify_tls = true
allow_insecure_loopback = false
timeout_seconds = 30
max_retries = 2
max_pages = 100
max_requests = 1000
retry_backoff_seconds = 0.5
retry_jitter_seconds = 0.25
retry_after_max_seconds = 60

[providers.public-github.cache]
enabled = false
path = ".git-evidence-cache.json"
ttl_seconds = 300
max_entries = 256

[report]
profile = "project-first"
language = "en"
display_actor_names = false

[report.actor_labels]

[report.privacy]
actor_display = "anonymous"
allow_source_urls = true
auth_redaction = true
